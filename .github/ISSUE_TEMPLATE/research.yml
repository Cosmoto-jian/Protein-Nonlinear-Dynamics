name: "research"
description: "A research problem: theory, experiment, data, novelty, figure or text"
labels: ["research"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [theory, experiment, data, novelty, figure, writing]
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location (file or ID, e.g. E-002, fig3, sec:results)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Acceptance criterion (becomes the failing check / done_when)
