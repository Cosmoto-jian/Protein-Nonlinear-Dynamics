name: "engineering"
description: "A bug or tooling problem (code, pipeline, gates, environment)"
labels: ["engineering"]
body:
  - type: input
    id: location
    attributes:
      label: Location (file or ID, e.g. E-002, fig3, sec:results)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Acceptance criterion (becomes the failing check / done_when)
