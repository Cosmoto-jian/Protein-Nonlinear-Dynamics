name: "scope"
description: "Off the research topic (owner)"
labels: ["scope", "triaged"]
body:
  - type: input
    id: location
    attributes:
      label: Location (file / ID, e.g. E-002, fig3, sec:results)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / acceptance criterion (used to write the failing check)
