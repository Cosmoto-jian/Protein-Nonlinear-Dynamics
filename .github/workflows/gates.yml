name: gates
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
      - run: pip install -r requirements.txt
      - run: make gates
      - run: make validate
      - run: make graph
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: results/logs/validation_report.md
