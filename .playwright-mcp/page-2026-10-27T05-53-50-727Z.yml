- generic [active] [ref=f27e1]: "{\"status\":\"ok\",\"message-type\":\"work\",\"message-version\":\"1.0.0\",\"message\":{\"indexed\":{\"date-parts\":[[2026,1,22]],\"date-time\":\"2026-01-22T14:18:06Z\",\"timestamp\":1769091486074,\"version\":\"3.49.0\"},\"reference-count\":63,\"publisher\":\"AIP Publishing\",\"issue\":\"20\",\"funder\":[{\"DOI\":\"10.13039\\/100000057\",\"name\":\"National Institute of General Medical Sciences\",\"doi-asserted-by\":\"publisher\",\"award\":[\"090208\"],\"award-info\":[{\"award-number\":[\"090208\"]}],\"id\":[{\"id\":\"10.13039\\/100000057\",\"id-type\":\"DOI\",\"asserted-by\":\"publisher\"}]},{\"DOI\":\"10.13039\\/100000121\",\"name\":\"Division of Mathematical Sciences\",\"doi-asserted-by\":\"publisher\",\"award\":[\"1160352\"],\"award-info\":[{\"award-number\":[\"1160352\"]}],\"id\":[{\"id\":\"10.13039\\/100000121\",\"id-type\":\"DOI\",\"asserted-by\":\"publisher\"}]},{\"DOI\":\"10.13039\\/100000145\",\"name\":\"Division of Information and Intelligent Systems\",\"doi-asserted-by\":\"publisher\",\"award\":[\"1302285\"],\"award-info\":[{\"award-number\":[\"1302285\"]}],\"id\":[{\"id\":\"10.13039\\/100000145\",\"id-type\":\"DOI\",\"asserted-by\":\"publisher\"}]}],\"content-domain\":{\"domain\":[\"pubs.aip.org\"],\"crossmark-restriction\":true},\"short-container-title\":[],\"published-print\":{\"date-parts\":[[2015,11,28]]},\"abstract\":\"<jats:p>Gaussian network model (GNM) and anisotropic network model (ANM) are some of the most popular methods for the study of protein flexibility and related functions. In this work, we propose generalized GNM (gGNM) and ANM methods and show that the GNM Kirchhoff matrix can be built from the ideal low-pass filter, which is a special case of a wide class of correlation functions underpinning the linear scaling flexibility-rigidity index (FRI) method. Based on the mathematical structure of correlation functions, we propose a unified framework to construct generalized Kirchhoff matrices whose matrix inverse leads to gGNMs, whereas, the direct inverse of its diagonal elements gives rise to FRI method. With this connection, we further introduce two multiscale elastic network models, namely, multiscale GNM (mGNM) and multiscale ANM (mANM), which are able to incorporate different scales into the generalized Kirchhoff matrices or generalized Hessian matrices. We validate our new multiscale methods with extensive numerical experiments. We illustrate that gGNMs outperform the original GNM method in the B-factor prediction of a set of 364 proteins. We demonstrate that for a given correlation function, FRI and gGNM methods provide essentially identical B-factor predictions when the scale value in the correlation function is sufficiently large. More importantly, we reveal intrinsic multiscale behavior in protein structures. The proposed mGNM and mANM are able to capture this multiscale behavior and thus give rise to a significant improvement of more than 11% in B-factor predictions over the original GNM and ANM methods. We further demonstrate the benefits of our mGNM through the B-factor predictions of many proteins that fail the original GNM method. We show that the proposed mGNM can also be used to analyze protein domain separations. Finally, we showcase the ability of our mANM for the analysis of protein collective motions.<\\/jats:p>\",\"DOI\":\"10.1063\\/1.4936132\",\"type\":\"journal-article\",\"created\":{\"date-parts\":[[2015,11,30]],\"date-time\":\"2015-11-30T19:14:41Z\",\"timestamp\":1448910881000},\"update-policy\":\"https:\\/\\/doi.org\\/10.1063\\/aip-crossmark-policy-page\",\"source\":\"Crossref\",\"is-referenced-by-count\":36,\"title\":[\"Multiscale Gaussian network model (mGNM) and multiscale anisotropic network model (mANM)\"],\"prefix\":\"10.1063\",\"volume\":\"143\",\"author\":[{\"given\":\"Kelin\",\"family\":\"Xia\",\"sequence\":\"first\",\"affiliation\":[{\"name\":\"Michigan State University 1 Department of Mathematics, , East Lansing, Michigan 48824, U