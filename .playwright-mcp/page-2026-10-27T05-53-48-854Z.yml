- generic [active] [ref=f23e1]: "{\"status\":\"ok\",\"message-type\":\"work\",\"message-version\":\"1.0.0\",\"message\":{\"indexed\":{\"date-parts\":[[2026,10,1]],\"date-time\":\"2026-10-01T17:04:59Z\",\"timestamp\":1790874299557,\"version\":\"4.1.0\"},\"reference-count\":68,\"publisher\":\"American Physical Society (APS)\",\"issue\":\"1\",\"license\":[{\"start\":{\"date-parts\":[[2026,2,27]],\"date-time\":\"2026-02-27T00:00:00Z\",\"timestamp\":1772150400000},\"content-version\":\"vor\",\"delay-in-days\":0,\"URL\":\"https:\\/\\/creativecommons.org\\/licenses\\/by\\/4.0\\/\"}],\"funder\":[{\"DOI\":\"10.13039\\/501100012166\",\"name\":\"National Key Research and Development Program of China\",\"doi-asserted-by\":\"publisher\",\"award\":[\"2024YFA0916800\"],\"award-info\":[{\"award-number\":[\"2024YFA0916800\"]}],\"id\":[{\"id\":\"10.13039\\/501100012166\",\"id-type\":\"DOI\",\"asserted-by\":\"publisher\"}]},{\"DOI\":\"10.13039\\/501100001809\",\"name\":\"National Natural Science Foundation of China\",\"doi-asserted-by\":\"publisher\",\"award\":[\"T2321001\"],\"award-info\":[{\"award-number\":[\"T2321001\"]}],\"id\":[{\"id\":\"10.13039\\/501100001809\",\"id-type\":\"DOI\",\"asserted-by\":\"publisher\"}]}],\"content-domain\":{\"domain\":[\"journals.aps.org\"],\"crossmark-restriction\":true},\"short-container-title\":[\"PRX Life\"],\"accepted\":{\"date-parts\":[[2026,1,23]]},\"abstract\":\"<jats:p>Mechanosensitive (MS) ion channels are crucial for translating mechanical stimuli into cellular responses; however, their dynamic properties pose significant challenges for experimental investigations. This study introduces two enhanced anisotropic network models (ANMs) that incorporate membrane contact probability (MCP) to more effectively capture the influence of the cell membrane on protein dynamics. MCP-ANM and MCP-multiscale ANM (mANM) outperform traditional ANM models that do not explicitly consider membranes when predicting the flexibility of various types of membrane proteins. Furthermore, by integrating MCP-mANM with perturbation response scanning, we are able to efficiently simulate the conformational changes of MS proteins subjected to different mechanical forces. This methodology allows for the examination of various gating mechanisms, including force-from-lipids and force-from-tether, across multiple MS ion channels such as no mechanoreceptor potential C, mechanosensitive channel of small conductance, and Piezo-type mechanosensitive ion channel. The calculated mechanosensitivity of the MS channels aligns well with the experimental findings. These results demonstrate the effectiveness of MCP-incorporated ANM in linking mechanical stimuli to protein dynamics, providing a reliable and efficient framework for understanding the mechanotransduction and gating mechanisms of MS ion channels.<\\/jats:p>\",\"DOI\":\"10.1103\\/xc5f-xr7n\",\"type\":\"journal-article\",\"created\":{\"date-parts\":[[2026,1,23]],\"date-time\":\"2026-01-23T19:39:58Z\",\"timestamp\":1769197198000},\"update-policy\":\"https:\\/\\/doi.org\\/10.1103\\/crossmark-policy\",\"source\":\"Crossref\",\"is-referenced-by-count\":3,\"title\":[\"Improved Anisotropic Network Models for Membrane Protein Dynamics and Mechanosensitive Ion Channels\"],\"prefix\":\"10.1103\",\"volume\":\"4\",\"author\":[{\"ORCID\":\"https:\\/\\/orcid.org\\/0000-0002-6088-2469\",\"authenticated-orcid\":true,\"given\":\"Zhongjie\",\"family\":\"Han\",\"sequence\":\"first\",\"affiliation\":[{\"id\":[{\"id\":\"https:\\/\\/ror.org\\/02v51f717\",\"id-type\":\"ROR\",\"asserted-by\":\"publisher\"}],\"name\":\"Peking University\"},{\"id\":[{\"id\":\"https:\\/\\/ror.org\\/02v51f717\",\"id-type\":\"ROR\",\"asserted-by\":\"publisher\"}],\"name\":\"Peking University\"}],\"role\":[{\"vocabulary\":\"crossref\",\"role\":\"author\"}]},{\"ORCID\":\"https:\\/\\/orcid.org\\/0000-0003-1544-3413\",\"authenticated-orcid\":true,\"given\":\"Lei\",\"family\":\"Wang\",\"sequence\":\"additional\",\"affiliation\":[{\"id\":[{