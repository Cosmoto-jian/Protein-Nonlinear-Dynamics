              - generic [ref=e214]: Questions
              - generic [ref=e215]:
                - paragraph [ref=e216]: 1. Calculate orientation for unreleased structure or membrane protein was not in OPM?
                - paragraph [ref=e217]:
                  - text: Please use our
                  - link "web server" [ref=e218] [cursor=pointer]:
                    - /url: /ppm_server2
                  - text: or we can process your coordinates through email (
                  - link "lomizeal@gmail.com" [ref=e219] [cursor=pointer]:
                    - /url: mailto:lomizeal@gmail.com
                  - text: ). All information is kept confidential. Orientation of membrane protein cannot be predicted if all its membrane-anchoring elements are missing or disordered.
                - paragraph [ref=e220]: 2. Errors in orientation or experimental verification description?
