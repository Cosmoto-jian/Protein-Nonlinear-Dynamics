        - generic [ref=e113]:
          - generic [ref=e114]:
            - paragraph [ref=e115]: OPM provides spatial arrangements of membrane proteins with respect to the hydrocarbon core of the lipid bilayer.
            - paragraph [ref=e116]:
              - text: OPM includes all unique experimental structures of transmembrane proteins and some peripheral proteins and membrane-active peptides (
              - link "Features" [ref=e117] [cursor=pointer]:
                - /url: /about#features
              - text: ).
            - paragraph [ref=e118]:
              - text: Each protein is positioned in a lipid bilayer of adjustable thickness and curvature by minimizing its transfer energy from water to the membrane (
              - link "Methods" [ref=e119] [cursor=pointer]:
                - /url: /about#methods_and_definitions
              - text: ).
            - paragraph [ref=e120]:
              - text: OPM provides structural classification and sorting according to different criteria (
              - link "Classification" [ref=e121] [cursor=pointer]:
                - /url: /about#classification
              - text: ).
            - paragraph [ref=e122]:
              - paragraph [ref=e123]:
                - generic [ref=e124]:
                  - text: OPM also provides a few preliminary results of
                  - link "our computational analysis" [ref=e125] [cursor=pointer]:
                    - /url: /about#tm_helix_assembly
                  - text: of transmembrane α-helix association in experimental structures of selected polytopic proteins (Assembly pages).
              - generic [ref=e127]:
                - text: For more information on single-spanning transmembrane proteins please see our
                - link "Membranome database" [ref=e128] [cursor=pointer]:
                  - /url: http://membranome.org/
          - generic [ref=e129]:
            - paragraph [ref=e130]: In citing the Orientations of Proteins in Membranes (OPM) database please refer to
            - paragraph [ref=e131]:
              - text: "Lomize MA, Pogozheva ID, Joo H., Mosberg HI, Lomize AL (2012) OPM database and PPM web server: resources for positioning of proteins in membranes. Nucleic Acids Res. 40 (Database issue), D370-D376."
              - link "PDF" [ref=e132] [cursor=pointer]:
                - /url: https://biomembhub.org/shared/opm-assets/pdfs/gkr703.pdf
              - link "PubMed" [ref=e133] [cursor=pointer]:
                - /url: https://www.ncbi.nlm.nih.gov/pubmed/21890895
            - paragraph [ref=e134]: For an explanation of our method please refer to
            - paragraph [ref=e135]:
              - text: "Lomize AL, Pogozheva ID, Lomize MA, Mosberg HI (2006) Positioning of proteins in membranes: A computational approach. Protein Science. 15, 1318-1333."
              - link "PDF" [ref=e136] [cursor=pointer]:
                - /url: https://biomembhub.org/shared/opm-assets/pdfs/PPM.pdf
              - link "PubMed" [ref=e137] [cursor=pointer]:
                - /url: https://www.ncbi.nlm.nih.gov/pubmed/16731967
            - paragraph [ref=e138]:
              - text: Lomize AL, Pogozheva ID, Mosberg HI (2011) Anisotropic solvent model of the lipid bilayer. 2. Energetics of insertion of small molecules, peptides, and proteins in membranes. J Chem Inf Model. 51, 930-946.
              - link "PDF" [ref=e139] [cursor=pointer]:
                - /url: https://biomembhub.org/shared/opm-assets/pdfs/PPM2.pdf
