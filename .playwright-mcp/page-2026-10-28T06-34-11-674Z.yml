        - heading "Orientations of Proteins in Membranes (OPM) database" [level=1] [ref=e102]
        - generic [ref=e104]:
          - link [ref=e105] [cursor=pointer]:
            - /url: /proteins/4314
          - link "Nav1.2-beta2-conotoxin complex pdb-6j8e" [ref=e109] [cursor=pointer]:
