# The single source of truth for every formal output. `python run_all.py` executes it, records hashes
# in pipeline.lock, and generates data_manifest.csv, figure_manifest.csv and graph.json from it.
#
# Step fields
#   name       unique id
#   cmd        command run from the project root ("python ..." uses the current interpreter)
#   deps       files or folders the step reads
#   outs       files or folders it writes: a path, or {path, units, purpose}
#   params     values recorded in the lock; a change makes the step stale
#   fast       true for figure_data -> figure steps (deps only under figure_data/ and plot/)
#   figure     figure id for figure_manifest.csv
#   expensive  skipped by `make all-cheap`
steps:
  - name: fig1
    cmd: python plot/fig1.py plot
    deps: [plot/fig1.py, plot/style.py]
    outs: [results/figures/fig1.pdf, results/figures/fig1.svg, results/figures/fig1.png, results/descriptions/fig1.md]
    fast: true
    figure: fig1

