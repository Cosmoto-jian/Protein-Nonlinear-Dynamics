# The single source of truth for every formal output. `python run_all.py` executes it, records hashes
# in pipeline.lock, and generates data_manifest.csv, figure_manifest.csv and graph.json from it.
#
# Step fields
#   name       unique id
#   cmd        command run from the project root ("python ..." uses the current interpreter)
#   deps       files or folders the step reads
#   outs       files or folders it writes: a path, or {path, units, purpose}
#   params     values recorded in the lock; a change makes the step stale
#   fast       true for figure_data -> figure steps (deps only under figure_data/ and plot/)
#   figure     figure id for figure_manifest.csv
#   expensive  skipped by `make all-cheap`
steps:
- name: models
  cmd: python src/prepare_models.py
  deps:
  - src/prepare_models.py
  - src/paths.py
  - data/raw/MANIFEST.yaml
  outs:
  - path: data/derived/models
    units: angstrom
    purpose: C-alpha model inputs in the OPM membrane frame
  params:
    half_thickness_override_A:
      4wff: 15.0
    drop_resname: UNK
    chains:
      4wff: AB
- name: path-2oar-rc10
  cmd: python src/run_path.py 2oar 10
  deps:
  - src/run_path.py
  - src/paths.py
  - src/model.py
  - src/inertia.py
  - src/vfife
  - data/derived/models
  - data/raw/MANIFEST.yaml
  outs:
  - path: data/derived/paths/2oar_rc10.json
    units: model units (k=1), angstrom
    purpose: 'tension path record: per-step strains, stability, validation and linearization metrics'
  - data/derived/paths/2oar_rc10_Xs.npy
  params:
    gauge: eckart6
    p20_stop: 0.12
    maxe_stop: 1.0
    eps_stop: 0.4
  expensive: true
